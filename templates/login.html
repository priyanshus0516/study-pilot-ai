{% extends 'base.html' %}

{% block title %}Log In – StudyPilot AI{% endblock %}

{% block unauth_content %}
<div style="min-height: 90vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 32px;">
            <div class="brand-icon" style="width: 48px; height: 48px; margin: 0 auto 16px; font-size: 1.4rem;">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 style="font-size: 1.6rem; margin-bottom: 6px;">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.92rem;">Sign in to access your notes and study workspace</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@college.edu" value="{{ email or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
                <i class="fa-solid fa-right-to-bracket"></i> Log In
            </button>
        </form>

        <div style="text-align: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('auth.signup') }}" style="font-weight: 600; color: #818cf8;">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
